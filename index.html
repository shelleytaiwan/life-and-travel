<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>生活＆旅行的AI工具</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% -10%, #fffdf8 0%, #f6f4ef 55%);
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .page { width: min(1280px, 100%); max-width: 1280px; }

    header { text-align: center; margin-bottom: 48px; }

    h1 {
      font-size: clamp(40px, 6vw, 64px);
      letter-spacing: 0.04em;
      line-height: 1.2;
      font-weight: 800;
      margin: 0;
    }

    .tools {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 20px;
    }

    .tool {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 18px 12px 18px;
      background: #ffffff;
      border: 1px solid #e6e1d8;
      border-radius: 32px;
      box-shadow: 0 12px 35px rgba(50, 42, 30, 0.08);
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      overflow: hidden;
    }

    .tool::after {
      content: "";
      position: absolute;
      width: 150px;
      height: 150px;
      right: -60px;
      bottom: -60px;
      border-radius: 50%;
      background: rgba(184, 135, 70, 0.08);
      transition: transform 0.25s ease;
      pointer-events: none;
    }

    .tool:hover {
      transform: translateY(-6px);
      border-color: #d4bd9c;
      box-shadow: 0 18px 42px rgba(50, 42, 30, 0.13);
    }
    .tool:hover::after { transform: scale(1.25); }
    .tool:focus-visible { outline: 3px solid #b88746; outline-offset: 3px; }

    /* 圖標容器：所有圖標裁成同樣大小，圖形一律填滿 */
    .icon {
      position: relative;
      z-index: 1;
      width: 140px;
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 28px;
      background: #faf8f3;
      border: 1px solid #eee8dd;
      overflow: hidden;
      flex-shrink: 0;
    }

    .icon img {
      width: 124px;
      height: 124px;
      object-fit: cover;
      border-radius: 26px;
      display: block;
    }

    .tool-name {
      position: relative;
      z-index: 1;
      margin: 12px 0 0;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 0.02em;
      text-align: center;
    }

    footer {
      margin-top: 60px;
      text-align: center;
      color: #a09a91;
      font-size: 13px;
      letter-spacing: 0.03em;
    }

    @media (max-width: 1000px) {
      .tools { grid-template-columns: repeat(3, 1fr); }
    }

    @media (max-width: 600px) {
      body { padding: 24px 12px; }
      .tools { grid-template-columns: repeat(2, 1fr); gap: 14px; }
      .tool { padding: 14px 8px; border-radius: 24px; }
      .tool-name { font-size: 22px; }
      .icon { width: 100%; max-width: 140px; height: auto; aspect-ratio: 1 / 1; }
      .icon img { width: 88%; height: 88%; }
      header { margin-bottom: 30px; }
      h1 { font-size: 36px; }
    }
  </style>
</head>
