<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生活＆旅行的AI工具</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Jost:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#f6f4ee;
    --cream-2:#efece3;
    --card:#ffffff;
    --ink:#221f1a;
    --clay:#a06a3c;
    --clay-soft:#c98f5c;
    --muted:#8b8578;
    --shadow: 0 24px 44px rgba(90,72,50,0.10);
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    min-height:100vh;
  }

  .wrap{
    max-width:1120px;
    margin:0 auto;
    padding:0 32px;
  }

  header{
    text-align:center;
    padding:96px 0 12px;
  }

  .eyebrow{
    font-family:"Jost", sans-serif;
    font-size:12.5px;
    font-weight:600;
    letter-spacing:0.3em;
    color:var(--clay);
    margin-bottom:20px;
  }

  h1{
    font-size:clamp(32px, 4.6vw, 50px);
    font-weight:900;
    letter-spacing:0.02em;
    margin:0 0 88px;
    line-height:1.3;
  }
  h1 .amp{
    color:var(--clay-soft);
  }

  main{
    padding-bottom:120px;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:26px;
    position:relative;
  }

  .blob{
    position:absolute;
    left:50%;
    bottom:-40px;
    transform:translateX(-50%);
    width:92%;
    height:70px;
    background:radial-gradient(ellipse at center, var(--cream-2) 0%, transparent 72%);
    filter:blur(2px);
    z-index:0;
    pointer-events:none;
  }

  .card{
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    background:var(--card);
    border-radius:26px;
    padding:40px 20px 34px;
    text-decoration:none;
    color:var(--ink);
    box-shadow:var(--shadow);
    transition:transform 0.28s ease, box-shadow 0.28s ease;
  }
  .card:hover{
    transform:translateY(-6px);
    box-shadow:0 30px 54px rgba(90,72,50,0.16);
  }

  .icon-box{
    width:168px;
    height:168px;
    border-radius:28px;
    background:linear-gradient(155deg, #fbfaf6, #efece3);
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:26px;
    overflow:hidden;
  }
  .icon-box img{
    width:132px;
    height:132px;
    object-fit:contain;
    border-radius:20px;
  }

  .card-title{
    font-size:19px;
    font-weight:700;
    letter-spacing:0.02em;
  }

  footer{
    text-align:center;
    padding:0 0 56px;
  }
  footer p{
    margin:0;
    font-size:11.5px;
    letter-spacing:0.08em;
    color:var(--muted);
  }

  @media (max-width:900px){
    .grid{grid-template-columns:repeat(2, 1fr);}
    header{padding:72px 0 8px;}
    h1{margin-bottom:56px;}
  }
  @media (max-width:480px){
    .grid{grid-template-columns:1fr;}
  }
</style>
</head>
